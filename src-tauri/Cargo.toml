[package]
name = "thornstube"
version = "0.0.1"
description = "A private YouTube client"
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "thornstube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: right-click > Inspect Element in release builds. TEMPORARY, for debugging; remove before release.
tauri = { version = "2", features = ["devtools"] }
# HTTP client used by the native_fetch command (src/lib.rs). No cookie store: tracking
# cookies must not persist. socks: FreeTube's proxy settings accept socks5 URLs.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "socks", "gzip", "brotli", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
panic = "abort"
