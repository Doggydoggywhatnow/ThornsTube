[package]
name = "thornstube"
version = "0.0.1"
description = "A private YouTube client"
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "thornstube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# - unsafe-headers: lets the app set Origin/Referer, which YouTube requires
# - default features are off on purpose: the default "cookies" feature keeps a
#   persistent cookie jar on disk, which would store YouTube tracking cookies.
# - socks: FreeTube's proxy settings accept socks5 URLs
tauri-plugin-http = { version = "2", default-features = false, features = ["unsafe-headers", "rustls-tls", "http2", "charset", "system-proxy", "socks"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
panic = "abort"
