[package]
name = "thornstube"
version = "0.0.0"
description = "A private YouTube client"
license = "AGPL-3.0-or-later"
edition = "2021"

[lib]
name = "thornstube_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# unsafe-headers: lets the app set Origin/Referer, which YouTube requires
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
strip = true
panic = "abort"
